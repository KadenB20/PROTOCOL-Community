name: Report a problem
description: Something did not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Keep personal records private. Do not attach databases, backups, bloodwork, or private photos."
  - type: input
    id: version
    attributes:
      label: PROTOCOL version
      description: Shown in Settings → Workspace & Data → About PROTOCOL.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What were you trying to do, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
  - type: input
    id: page
    attributes:
      label: Page or module
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat the problem
      description: Leave blank or say you cannot reproduce it if you are unsure.
  - type: textarea
    id: technical
    attributes:
      label: Technical details
      description: Optional details prepared by PROTOCOL. Do not paste raw database errors or personal paths.
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Crop out private information before uploading. Files upload when selected, before you submit the issue.
    validations:
      accept: ".png,.jpg,.jpeg"
      required: false
  - type: upload
    id: diagnostics
    attributes:
      label: PROTOCOL diagnostics (optional)
      description: Extract diagnostics.txt from the report ZIP. Do not attach a database, workspace backup, or unrelated log.
    validations:
      accept: ".txt"
      required: false
