name: Installation warning or antivirus block
description: Report an unknown-publisher warning, threat detection or blocked installer.
title: "[Installation] "
body:
  - type: markdown
    attributes:
      value: |
        Leave the file blocked. Don't turn off your antivirus, add an exception or restore a quarantined file to test it.
        Anyone can read this report. Don't attach backups, databases, health records, private photos, passwords or access tokens. Crop personal details out of screenshots.
  - type: input
    id: version
    attributes:
      label: PROTOCOL version and installer filename
      description: Copy these from the release page or downloaded filename; you do not need to open the app.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Download page
      description: Link to the page where you found the download. Don't include a private sharing link.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example, Windows 11 25H2. Is this your own computer, or one managed by work or school?
    validations:
      required: true
  - type: input
    id: security_product
    attributes:
      label: Security software
      description: Which antivirus or Windows feature showed the warning? Include its version if you know it. It's OK if you're not sure.
    validations:
      required: true
  - type: textarea
    id: warning
    attributes:
      label: Exact warning or threat name
      description: Copy the message or attach a cropped screenshot. Say whether it happened during download, installation or app startup.
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: Installer SHA-256 (optional)
      description: Include this if you checked the download. Do not upload the installer here.
